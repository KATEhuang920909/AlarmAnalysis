<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>告警列表</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
        body {background:#f5f7fa;padding:20px;}
        .container {max-width:1200px;margin:0 auto;}
        .card {background:white;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0001;}
        table {width:100%;border-collapse:collapse;margin-top:10px;}
        th,td {padding:10px;text-align:left;border-bottom:1px solid #eee;}
        th {background:#f9fafb;}
        a {color:#0066cc;text-decoration:none;margin-right:16px;}
        a:hover {text-decoration:underline;}
        .p0 {color:#dc2626;font-weight:600;}
        .p1 {color:#ea580c;font-weight:600;}
        .p2 {color:#d97706;font-weight:600;}
        .p3 {color:#64748b;}
    </style>
</head>
<body>
<div class="container">
    <h1>降噪后告警列表</h1>
    <div style="margin:20px 0;">
        <a href="/">首页</a>
        <a href="/alerts">告警列表</a>
        <a href="/faults">故障根因</a>
        <a href="/warnings">风险预警</a>
    </div>
    <div class="card">
        <table>
            <tr>
                <th>服务</th>
                <th>是否有效</th>
                <th>优先级</th>
                <th>出现次数</th>
                <th>判断依据</th>
            </tr>
            {% for item in alerts %}
            <tr>
                <td>{{ item.service }}</td>
                <td>{{ item['是否有效'] }}</td>
                <td class="{{ item.优先级 | lower }}">{{ item.优先级 }}</td>
                <td>{{ item.alert_count }}</td>
                <td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                    {{ item['判断依据'] }}
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
</body>
</html>
