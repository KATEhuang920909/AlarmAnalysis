<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>大模型智能告警分析平台</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
        body {background:#f5f7fa;padding:20px;}
        .container {max-width:1200px;margin:0 auto;}
        .card {background:white;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0001;}
        .grid {display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
        h1 {margin-bottom:20px;color:#222;}
        h2 {font-size:18px;margin-bottom:12px;color:#444;}
        .num {font-size:26px;font-weight:600;color:#0066cc;}
        .label {font-size:14px;color:#666;margin-top:4px;}
        a {color:#0066cc;text-decoration:none;margin-right:16px;}
        a:hover {text-decoration:underline;}
    </style>
</head>
<body>
<div class="container">
    <h1>大模型智能告警分析平台</h1>
    <div style="margin-bottom:20px;">
        <a href="/">首页</a>
        <a href="/alerts">告警列表</a>
        <a href="/faults">故障根因</a>
        <a href="/warnings">风险预警</a>
    </div>

    <div class="grid">
        <div class="card">
            <div class="num">{{ metrics.total_alerts }}</div>
            <div class="label">原始告警总数</div>
        </div>
        <div class="card">
            <div class="num">{{ metrics.valid_alerts }}</div>
            <div class="label">有效告警数</div>
        </div>
        <div class="card">
            <div class="num">{{ metrics.noise_reduction_rate }}%</div>
            <div class="label">告警降噪率</div>
        </div>
        <div class="card">
            <div class="num">{{ metrics.fault_events }}</div>
            <div class="label">故障事件数</div>
        </div>
        <div class="card">
            <div class="num">{{ metrics.high_risk_warnings }}</div>
            <div class="label">高风险预警</div>
        </div>
        <div class="card">
            <div class="num">{{ metrics.alert_clusters }}</div>
            <div class="label">语义聚类数</div>
        </div>
    </div>
</div>
</body>
</html>
