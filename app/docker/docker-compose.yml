# docker/docker-compose.yml
version: "3.8"

services:
  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env.prod
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    restart: always

  celery_worker:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    env_file:
      - ../.env.prod
    depends_on:
      - redis
      - rabbitmq
      - postgres
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    restart: always

  celery_beat:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    command: celery -A app.tasks beat --loglevel=info
    env_file:
      - ../.env.prod
    depends_on:
      - redis
      - rabbitmq
      - postgres
    restart: always

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: alert_user
      POSTGRES_PASSWORD: alert_pass
      POSTGRES_DB: alert_analysis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_user
      RABBITMQ_DEFAULT_PASS: rabbit_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: